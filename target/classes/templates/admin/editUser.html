<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>CityFix - Edit User</title>
    <style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"tertiary-fixed-dim":"#ffb59a","on-secondary-fixed-variant":"#005236","on-tertiary":"#ffffff","on-tertiary-fixed":"#380d00","on-primary-fixed-variant":"#173bab","on-primary":"#ffffff","primary-container":"#1e40af","tertiary":"#611e00","error":"#ba1a1a","secondary":"#006c49","on-error":"#ffffff","surface-container-highest":"#e0e3e5","on-surface":"#191c1e","secondary-fixed":"#6ffbbe","error-container":"#ffdad6","surface-container-low":"#f2f4f6","on-tertiary-container":"#ffa583","surface":"#f7f9fb","inverse-primary":"#b8c4ff","surface-container-high":"#e6e8ea","on-secondary-container":"#00714d","outline":"#757684","secondary-container":"#6cf8bb","on-secondary-fixed":"#002113","surface-bright":"#f7f9fb","outline-variant":"#c4c5d5","primary-fixed-dim":"#b8c4ff","on-primary-container":"#a8b8ff","primary":"#00288e","on-surface-variant":"#444653","surface-tint":"#3755c3","on-primary-fixed":"#001453","surface-container":"#eceef0","primary-fixed":"#dde1ff","tertiary-container":"#872d00","on-error-container":"#93000a","inverse-surface":"#2d3133","on-tertiary-fixed-variant":"#802a00","on-secondary":"#ffffff","inverse-on-surface":"#eff1f3","secondary-fixed-dim":"#4edea3","surface-container-lowest":"#ffffff","tertiary-fixed":"#ffdbce","on-background":"#191c1e","background":"#f7f9fb","surface-variant":"#e0e3e5","surface-dim":"#d8dadc"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-desktop":"32px","margin-mobile":"16px","base":"4px","sidebar-width":"280px","gutter":"24px","container-max":"1440px"},"fontFamily":{"display-lg":["Inter"],"label-sm":["Inter"],"title-md":["Inter"],"label-md":["Inter"],"headline-lg":["Inter"],"body-lg":["Inter"],"headline-lg-mobile":["Inter"],"body-md":["Inter"]},"fontSize":{"display-lg":["48px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"label-sm":["12px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"600"}],"title-md":["20px",{"lineHeight":"1.4","fontWeight":"600"}],"label-md":["14px",{"lineHeight":"1.2","letterSpacing":"0.01em","fontWeight":"500"}],"headline-lg":["32px",{"lineHeight":"1.25","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"1.3","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}]}}}}</script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
</head>
<body class="bg-surface font-body-md text-on-surface">

<aside class="fixed left-0 top-0 h-full w-sidebar-width bg-surface-container-lowest border-r border-outline-variant z-50 flex flex-col">
    <div class="p-6 flex items-center gap-3 border-b border-outline-variant">
        <img alt="CityFix Logo" class="h-8 w-auto" th:src="@{/screen.png}">
        <span class="font-title-md text-title-md text-primary">CityFix</span>
    </div>
    <nav class="flex-1 py-6 px-4 space-y-2">
        <a th:href="@{/admin/dashboard}" class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all">
            <span class="material-symbols-outlined mr-3">dashboard</span>
            <span class="font-label-md text-label-md">Dashboard</span>
        </a>
        <a th:href="@{/admin/complaints}" class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all">
            <span class="material-symbols-outlined mr-3">assignment</span>
            <span class="font-label-md text-label-md">Manage Complaints</span>
        </a>
        <a th:href="@{/admin/users}" class="flex items-center px-4 py-3 rounded-xl bg-secondary-container text-on-secondary-container transition-all">
            <span class="material-symbols-outlined mr-3">group</span>
            <span class="font-label-md text-label-md">Manage Users</span>
        </a>
        <a sec:authorize="hasRole('SUPER_ADMIN')" th:href="@{/admin/admins}" class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all">
            <span class="material-symbols-outlined mr-3">admin_panel_settings</span>
            <span class="font-label-md text-label-md">Manage Admins</span>
        </a>
        <a th:href="@{/admin/profile}" class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all">
            <span class="material-symbols-outlined mr-3">person</span>
            <span class="font-label-md text-label-md">Profile</span>
        </a>
    </nav>
    <div class="p-4 mt-auto border-t border-outline-variant">
        <a th:href="@{/logout}" class="flex items-center px-4 py-3 rounded-xl text-error hover:bg-error-container transition-all">
            <span class="material-symbols-outlined mr-3">logout</span>
            <span class="font-label-md text-label-md">Logout</span>
        </a>
    </div>
</aside>

<div class="pl-sidebar-width">
    <main class="min-h-screen bg-surface flex items-center justify-center px-margin-desktop py-12">
        <div class="w-full max-w-2xl">

            <div class="bg-surface-container-lowest rounded-2xl shadow-xl overflow-hidden border border-outline-variant/20">

                <!-- Header -->
                <div class="p-8 flex items-center gap-4 border-b border-outline-variant/30">
                    <div class="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-on-primary-container text-[28px]">edit</span>
                    </div>
                    <div>
                        <h1 class="font-headline-lg text-headline-lg text-on-surface">Edit User</h1>
                        <p class="font-body-md text-on-surface-variant mt-1">Update this citizen's account details.</p>
                    </div>
                </div>

                <!-- Form -->
                <form th:action="@{'/admin/users/' + ${citizen.id} + '/edit'}" th:object="${citizen}" method="post" class="p-8">

                    <div class="flex items-center gap-4 bg-surface-container rounded-xl p-5 mb-8">
                        <div class="w-14 h-14 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container font-bold uppercase text-xl shrink-0"
                             th:text="${#strings.isEmpty(citizen.name)} ? '?' : ${#strings.substring(citizen.name, 0, 1)}">JD</div>
                        <div class="min-w-0">
                            <p class="font-label-md text-on-surface-variant">Citizen ID</p>
                            <p class="font-title-md text-on-surface" th:text="${citizen.citizenId}">CTZ-0001</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="md:col-span-2">
                            <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="name">Full Name</label>
                            <input id="name" th:field="*{name}" type="text"
                                   class="w-full px-4 py-3 rounded-lg bg-surface-container border border-outline-variant outline-none focus:ring-2 focus:ring-primary/20 font-body-md text-on-surface" required>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email</label>
                            <input id="email" th:field="*{email}" type="email"
                                   class="w-full px-4 py-3 rounded-lg bg-surface-container border border-outline-variant outline-none focus:ring-2 focus:ring-primary/20 font-body-md text-on-surface" required>
                        </div>

                        <div>
                            <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="phone">Phone</label>
                            <input id="phone" th:field="*{phone}" type="text"
                                   class="w-full px-4 py-3 rounded-lg bg-surface-container border border-outline-variant outline-none focus:ring-2 focus:ring-primary/20 font-body-md text-on-surface">
                        </div>

                        <div>
                            <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="city">Ward / District</label>
                            <input id="city" th:field="*{address.city}" type="text"
                                   class="w-full px-4 py-3 rounded-lg bg-surface-container border border-outline-variant outline-none focus:ring-2 focus:ring-primary/20 font-body-md text-on-surface">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-3">
                        <a th:href="@{/admin/users}"
                           class="flex-1 h-12 flex items-center justify-center rounded-lg border border-outline-variant text-on-surface font-label-md hover:bg-surface-container transition-all">
                            Cancel
                        </a>
                        <button type="submit"
                                class="flex-1 h-12 flex items-center justify-center gap-2 rounded-lg bg-primary text-on-primary font-label-md hover:opacity-90 active:scale-[0.98] transition-all">
                            <span class="material-symbols-outlined text-[20px]">save</span>
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
