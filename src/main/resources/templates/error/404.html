<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>CityFix - Page Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #f7f9fb 0%, #eaf2ff 55%, #eef7f0 100%);
            background-size: 200% 200%;
            animation: bgShift 12s ease infinite;
            color: #191c1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-dot {
            position: fixed;
            border-radius: 50%;
            background: rgba(0, 40, 142, 0.07);
            animation: floatDot 8s ease-in-out infinite;
            pointer-events: none;
        }
        .bg-dot:nth-child(1) { width: 60px; height: 60px; top: 12%; left: 8%; animation-delay: 0s; }
        .bg-dot:nth-child(2) { width: 30px; height: 30px; top: 70%; left: 12%; animation-delay: 1.5s; background: rgba(0,108,73,0.08); }
        .bg-dot:nth-child(3) { width: 45px; height: 45px; top: 20%; right: 10%; animation-delay: 3s; background: rgba(186,26,26,0.06); }
        .bg-dot:nth-child(4) { width: 24px; height: 24px; bottom: 14%; right: 16%; animation-delay: 2s; }

        @keyframes floatDot {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-22px) translateX(10px); }
        }

        .card {
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeDown .6s ease forwards;
        }
        .brand img { height: 32px; width: auto; }
        .brand span {
            font-weight: 700;
            font-size: 20px;
            color: #00288e;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .illustration-box {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 32px 24px 28px;
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(18px);
            animation: cardIn .6s ease .15s forwards;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .code-text {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            color: #191c1e;
            margin-bottom: 4px;
        }
        .code-text span {
            color: #00288e;
            display: inline-block;
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        svg.scene { width: 100%; max-width: 340px; height: auto; margin: 8px auto 12px; display: block; }

        /* character idle bob */
        #char-group {
            animation: bob 3s ease-in-out infinite;
            transform-origin: 160px 214px;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* magnifying glass sweeping search motion */
        #magnifier {
            animation: sweep 3.6s ease-in-out infinite;
            transform-origin: 260px 130px;
        }
        @keyframes sweep {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(6px,-4px) rotate(6deg); }
            75% { transform: translate(-4px,4px) rotate(-4deg); }
        }

        /* floating question marks */
        .qmark {
            animation: floatQ 3.2s ease-in-out infinite;
        }
        .qmark:nth-child(1) { animation-delay: 0s; }
        .qmark:nth-child(2) { animation-delay: .6s; }
        .qmark:nth-child(3) { animation-delay: 1.2s; }
        @keyframes floatQ {
            0%, 100% { transform: translateY(0); opacity: 0.55; }
            50% { transform: translateY(-8px); opacity: 1; }
        }

        /* dashed path pulse, signpost swaying like it's pointing nowhere useful */
        #signpost {
            animation: swaySign 4s ease-in-out infinite;
            transform-origin: 330px 232px;
        }
        @keyframes swaySign {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }

        .lost-text {
            font-weight: 700;
            font-size: 20px;
            color: #191c1e;
            margin-top: 6px;
            opacity: 0;
            animation: fadeUp .5s ease .5s forwards;
        }
        .sub-text {
            font-size: 14px;
            color: #444653;
            margin-top: 6px;
            line-height: 1.5;
            opacity: 0;
            animation: fadeUp .5s ease .65s forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 22px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp .5s ease .8s forwards;
        }
        .btn {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: opacity .15s ease, transform .1s ease, box-shadow .2s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #00288e;
            color: #ffffff;
        }
        .btn-primary:hover { opacity: 0.92; box-shadow: 0 6px 16px rgba(0,40,142,0.3); transform: translateY(-1px); }
        .btn-outline {
            background: transparent;
            color: #191c1e;
            border: 1px solid #c4c5d5;
        }
        .btn-outline:hover { background: #eceef0; transform: translateY(-1px); }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            transform: scale(0);
            animation: rippleAnim .55s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(3); opacity: 0; }
        }

        .footnote {
            margin-top: 22px;
            font-size: 12px;
            color: #757684;
            opacity: 0;
            animation: fadeUp .5s ease .95s forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

<div class="bg-dot"></div>
<div class="bg-dot"></div>
<div class="bg-dot"></div>
<div class="bg-dot"></div>

<div class="card">
    <div class="brand">
        <img alt="CityFix Logo" th:src="@{/screen.png}" src="/screen.png">
        <span>CityFix</span>
    </div>

    <div class="illustration-box">
        <div class="code-text">4<span>0</span>4</div>

        <svg class="scene" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" id="scene-svg">
            <defs>
                <linearGradient id="skinGrad2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffddc2"/>
                    <stop offset="100%" stop-color="#f7c19c"/>
                </linearGradient>
                <linearGradient id="tunicGrad2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f0a04b"/>
                    <stop offset="100%" stop-color="#d9822f"/>
                </linearGradient>
                <linearGradient id="beardGrad2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#5a3521"/>
                    <stop offset="100%" stop-color="#3d2314"/>
                </linearGradient>
                <radialGradient id="groundGrad2" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#e4e7ee"/>
                    <stop offset="100%" stop-color="#eef0f5"/>
                </radialGradient>
            </defs>

            <ellipse cx="200" cy="248" rx="175" ry="15" fill="url(#groundGrad2)"/>

            <path d="M35 240 q7 -16 14 0" stroke="#2e9e6f" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M49 240 q7 -21 14 0" stroke="#249163" stroke-width="5" fill="none" stroke-linecap="round"/>

            <!-- dashed winding path leading nowhere -->
            <path d="M55 236 Q 140 216 200 232 T 345 226" stroke="#c8ccdb" stroke-width="3" fill="none" stroke-dasharray="6 9" stroke-linecap="round"/>

            <!-- signpost with a blank / broken sign, pointing off-path -->
            <g id="signpost">
                <rect x="323" y="156" width="8" height="82" rx="3" fill="#5a3521"/>
                <rect x="296" y="144" width="62" height="28" rx="5" fill="#eceef4" stroke="#c1c6db" stroke-width="1.5"/>
                <text x="327" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#7c86a8">?</text>
            </g>

            <!-- floating question marks -->
            <text class="qmark" x="253" y="72" font-size="21" font-weight="800" fill="#3452b4">?</text>
            <text class="qmark" x="285" y="98" font-size="14" font-weight="800" fill="#8fa0e6">?</text>
            <text class="qmark" x="268" y="122" font-size="16" font-weight="800" fill="#3452b4">?</text>

            <!-- character looking through magnifying glass -->
            <g id="char-group">
                <ellipse cx="160" cy="243" rx="30" ry="6" fill="#d7dae2" opacity="0.6"/>

                <!-- legs -->
                <path d="M149 194 q-2 16 -1 26 q0 4 5 4 q4 0 4 -4 q1 -14 3 -26 z" fill="#5a3521"/>
                <path d="M171 194 q2 16 1 26 q0 4 -5 4 q-4 0 -4 -4 q-1 -14 -3 -26 z" fill="#5a3521"/>
                <ellipse cx="153" cy="224" rx="6" ry="3.5" fill="#3d2314"/>
                <ellipse cx="167" cy="224" rx="6" ry="3.5" fill="#3d2314"/>

                <!-- tunic -->
                <path d="M138 152 q22 -12 44 0 l7 44 q-29 11 -58 0 z" fill="url(#tunicGrad2)"/>
                <path d="M138 152 q22 -12 44 0 l2 12 q-24 -10 -48 0 z" fill="#b96f22"/>
                <path d="M151 156 l3 38 M169 156 l-3 38" stroke="#c47420" stroke-width="1.4" opacity="0.5"/>
                <rect x="142" y="182" width="36" height="5" rx="2" fill="#6b3a17"/>

                <!-- relaxed arm -->
                <path d="M138 160 q-16 6 -20 16 q-1.5 3 1.5 4.5 q3 1.5 4.5 -1.5 q5 -9 17 -12 z" fill="url(#skinGrad2)"/>

                <!-- arm raised holding magnifier -->
                <path d="M182 158 q18 2 28 14 q2.5 3 -0.5 5 q-3 2 -5 -0.5 q-8 -10 -25 -12 z" fill="url(#skinGrad2)"/>

                <!-- neck -->
                <rect x="153" y="146" width="14" height="10" rx="4" fill="#f0b88f"/>

                <!-- ears -->
                <ellipse cx="140" cy="134" rx="4.5" ry="6" fill="url(#skinGrad2)"/>
                <ellipse cx="180" cy="134" rx="4.5" ry="6" fill="url(#skinGrad2)"/>

                <!-- head -->
                <circle cx="160" cy="130" r="22" fill="url(#skinGrad2)"/>

                <!-- beard -->
                <path d="M139 134 q-2 24 21 27 q23 -3 21 -27 q-3 13 -21 15 q-18 -2 -21 -15 z" fill="url(#beardGrad2)"/>
                <path d="M141 132 q19 22 38 0 q3 18 -19 21 q-22 -3 -19 -21 z" fill="#4a2c1a"/>

                <!-- mustache -->
                <path d="M148 137 q12 7 24 0 q-2 6 -12 6.5 q-10 -0.5 -12 -6.5 z" fill="#3d2314"/>

                <!-- mouth hint -->
                <path d="M155 148 q5 3 10 0" stroke="#2a1710" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7"/>

                <!-- nose -->
                <path d="M158 120 q3.5 7 0.5 10.5 q-2.5 1.5 -4.5 -0.5" stroke="#dd9b78" stroke-width="1.6" fill="none" stroke-linecap="round"/>

                <!-- eyebrows: curious, raised toward magnifier -->
                <path d="M147 115 q5 -3.5 10 -1" stroke="#2a1710" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                <path d="M163 113 q5 -3.5 10 0.5" stroke="#2a1710" stroke-width="2.4" fill="none" stroke-linecap="round"/>

                <!-- eyes -->
                <ellipse cx="152" cy="122" rx="2.6" ry="3" fill="#ffffff"/>
                <ellipse cx="168" cy="122" rx="2.6" ry="3" fill="#ffffff"/>
                <circle cx="152.5" cy="122.5" r="1.7" fill="#2a1710"/>
                <circle cx="168.5" cy="122.5" r="1.7" fill="#2a1710"/>
                <circle cx="153.1" cy="121.7" r="0.5" fill="#ffffff"/>
                <circle cx="169.1" cy="121.7" r="0.5" fill="#ffffff"/>

                <!-- hair -->
                <path d="M139 126 q-4 -26 21 -28 q25 2 21 28 q-3 -15 -21 -15 q-18 0 -21 15 z" fill="#4a2c1a"/>
                <path d="M140 122 q0 -8 4 -12" stroke="#5a3521" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
                <path d="M180 122 q0 -8 -4 -12" stroke="#5a3521" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
            </g>

            <!-- magnifying glass -->
            <g id="magnifier">
                <circle cx="248" cy="118" r="27" fill="#eef2ff" stroke="#3452b4" stroke-width="5"/>
                <circle cx="248" cy="118" r="27" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
                <line x1="267" y1="137" x2="290" y2="160" stroke="#3452b4" stroke-width="7" stroke-linecap="round"/>
            </g>
        </svg>

        <p class="lost-text">This page seems to have wandered off</p>
        <p class="sub-text">We couldn't find the page you were looking for.<br>
            It may have been moved, renamed, or never existed.</p>

        <div class="btn-row">
            <a href="/" class="btn btn-primary" data-ripple>Go to Home</a>
            <a href="/logout" class="btn btn-outline" data-ripple>Switch Account</a>
        </div>
    </div>

    <p class="footnote">Error 404 &middot; CityFix Page Not Found</p>
</div>

<script>
    document.querySelectorAll('[data-ripple]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            var rect = btn.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(function () { ripple.remove(); }, 550);
        });
    });
</script>

</body>
</html>
